[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eduanalytics-ai"
version = "1.0.0"
description = "AI-Powered Engineering College Admission Analytics Platform"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "pillow>=10.0.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "google-genai>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.vercel]
entrypoint = "backend.main:app"
